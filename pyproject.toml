[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beli-mcp"
version = "0.1.0"
description = "Unofficial Beli MCP server for AI assistants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
beli-mcp = "beli_mcp.server:main"

[tool.setuptools]
packages = ["beli_mcp"]
